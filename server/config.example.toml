# 复制为 config.toml 后填写。config.toml 已在 .gitignore 中，不要提交。

[server]
host = "127.0.0.1"
port = 8891
token = ""                # 开放到局域网时务必设置；插件设置里填同样的值
# work_dir = ""           # 任务临时文件的位置，默认系统临时目录
# result_ttl_seconds = 3600   # 已完成任务的结果保留多久
# max_upload_mb = 200

# 每个 profile 是一个 OpenAI 兼容的大模型接口；插件按 name 选择，留空用第一个
[[profiles]]
name = "deepseek"
base_url = "https://api.deepseek.com"
api_key = "sk-..."
model = "deepseek-chat"
qps = 4
# temperature = "0"       # 设置了才会发送
# timeout = "120"
# 原样合并进每次请求体的额外字段。DeepSeek 等默认开启思考的模型，关掉能快很多：
extra_body = { thinking = { type = "disabled" } }
