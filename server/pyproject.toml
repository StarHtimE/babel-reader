[project]
name = "babel-reader-server"
version = "0.2.0"
description = "Babel Reader 的本地翻译服务：通过 pdf2zh_next / BabelDOC 翻译 PDF"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdf2zh-next>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
babel-reader-server = "babel_reader_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babel_reader_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
